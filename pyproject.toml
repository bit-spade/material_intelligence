[project]
name = "material-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docx2txt>=0.9",
    "python-dotenv>=1.0.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.0",
    "pillow>=10.0.0",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "requests>=2.32.0",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
vision = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.46.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.50.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
